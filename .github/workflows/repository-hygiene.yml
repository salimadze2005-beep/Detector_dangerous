name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_repository_hygiene.py
      - run: python -m compileall -q audio core tools ui video main.py run.py
